name: "Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Cache asdf
        uses: actions/cache@v4
        with:
          path: ~/.asdf
          key: ${{ runner.os }}-asdf-${{ hashFiles('**/.tool-versions') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-asdf-

      - name: Install asdf & tools
        uses: asdf-vm/actions/install@v3

      - name: Build the executable
        run: make build

      - name: Package the executable
        run: make pack

      - name: Name the executable
        id: setbinary
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            echo "binary_name=gai.exe" >> $GITHUB_OUTPUT
          else
            echo "binary_name=gai" >> $GITHUB_OUTPUT
          fi

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: gai-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.setbinary.outputs.binary_name }}
