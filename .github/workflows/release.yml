name: "Build"

on:
  push:
    tags: ["v*"]
    branches: ["develop"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  binary:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Cache asdf and Go modules cache
        uses: actions/cache@v4
        with:
          path: ~/.asdf
          key: ${{ runner.os }}-asdf-${{ hashFiles('**/.tool-versions') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-asdf-

      - name: Install asdf & tools
        uses: asdf-vm/actions/install@v3

      - name: Build the executable
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o gai-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Rename the executable
        if: ${{ matrix.goos == 'windows' }}
        run: mv gai-${{ matrix.goos }}-${{ matrix.goarch }} gai-${{ matrix.goos }}-${{ matrix.goarch }}.exe

      - name: Package the executable
        if: ${{ ! (matrix.goos == 'windows' && matrix.goarch == 'arm64') }}
        run: upx --best --lzma --force-macos gai*

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          preserve_order: true
          files: |
            gai-${{ matrix.goos }}-${{ matrix.goarch }}
            gai-${{ matrix.goos }}-${{ matrix.goarch }}.exe

  docker:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
